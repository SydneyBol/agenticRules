[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offer-xml-generator"
version = "0.1.0"
description = "English description of a Gravty reward offer -> Blockly rule XML the stock gravty-ui loads"
requires-python = ">=3.11"
dependencies = ["anthropic[bedrock]>=1.17,<2", "langchain-core==1.7.0", "langchain-aws[anthropic]==1.8.1", "pydantic>=2.14", "langgraph==1.2.14", "Flask>=3.1", "jsonschema>=4.26", "httpx>=0.28",
                "sentence-transformers==6.2.0"]  # lookup_values by meaning: embeddings + cross-encoder (core/tenant/value_search.py)

[project.optional-dependencies]
pulsar = ["pandas==3.1.0", "xmlschema==4.3.2", "defusedxml==0.7.1"]  # Pulsar's own sub-prompt code (offer-harvest)
dev = ["pytest==9.1.1", "ruff==0.14.10", "mypy==1.19.1"]

[project.scripts]
offer-xml = "offer_author.api.cli:main"
offer-xml-server = "offer_author.api.service:main"
offer-harvest = "offer_author.api.harvest:main"

[tool.setuptools.packages.find]
include = ["offer_author*"]

[tool.setuptools.package-data]
"offer_author.ai" = ["context/*.md"]
"offer_author.core" = ["data/*.json", "data/blueprints/*.xml", "data/segments/*.xml"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "C90", "D", "ANN", "RUF", "BLE"]
ignore = ["D105", "D107", "ANN401", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
# tests and generator scripts: no docstring or annotation rules, and their long literals, inline lambdas and one-line
# file reads stay as written
"tests/**" = ["D", "ANN", "N802", "E501", "E731", "SIM115", "C901"]
"tools/**" = ["D", "ANN", "E501", "E731", "SIM115", "C901", "RUF005"]

[tool.mypy]
python_version = "3.14"
packages = ["offer_author"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -m 'not live and not e2e'"
markers = [
    "live: calls Claude on Bedrock (needs AWS credentials; costs a few cents)",
    "e2e: needs the dev workspace (tenant catalogs, the value-search models)",
]
