[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offer-xml-generator"
version = "0.1.0"
description = "English description of a Gravty reward offer -> Blockly rule XML the stock gravty-ui loads"
requires-python = ">=3.11"
dependencies = ["anthropic[bedrock]>=1.17", "Flask>=3.1", "jsonschema>=4.26", "httpx>=0.28"]

[project.optional-dependencies]
test = ["pytest>=8", "PyYAML>=6"]

[project.scripts]
offer-xml = "offer_author.api.cli:main"
offer-xml-server = "offer_author.api.service:main"

[tool.setuptools]
packages = ["offer_author", "offer_author.ai", "offer_author.core", "offer_author.api"]

[tool.setuptools.package-data]
"offer_author.ai" = ["context/*.md"]
"offer_author.core" = ["data/*.json", "data/blueprints/*", "data/segments/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -m 'not live and not e2e'"
markers = [
    "live: calls Claude on Bedrock (needs AWS credentials; costs a few cents)",
    "e2e: drives the real gravty-ui Blockly (ng serve on :4200), the compile service and the engine harness jar",
]
