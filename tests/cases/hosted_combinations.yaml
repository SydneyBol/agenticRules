# Combination cases for hosted devintam1, in the tenant's own words, all run on ONE offer
# ("AI Rules Combination Test"): each prompt goes through the rules-screen GenAI popup, replaces the rules, is saved,
# and the saved DRL is checked in the engine (tools/qa/check_hosted_combos.py).
#
# devintam1 codes: stores HQ (Chennai HQ), WEB (online store), Chennai, VJD (Vijayawada); tier_class GOLD/Gold,
# Silver, Basic; privileges 37 (2 hours of yoga), 64 (complimentary voucher); loyalty account 12, tag BASE.
# BIT row: [date, amount, store, expect] with expect = points (number), privilege id (string) or null (no points and no
# privilege). Each sequence is one member whose counters carry from BIT to BIT; a note says what a sequence checks.
# probe: [sequence, bit] = the paying BIT the store probes replay at other stores (default: cheapest at a named store).
# A BIT's activity type is the one the saved rule requires (read from the DRL). Member default: tier_class GOLD.

cases:
  - id: H01_tier_store_bands_cap
    prompt: "Gold members spending $100 or more at the Chennai HQ store earn 3x points, $50 to $99.99 earns 2x, with a maximum of 2000 bonus points per member."
    sequences:
      - member: {tier_class: GOLD}
        bits: [["2026-10-20T12:00:00", 100, HQ, 300], ["2026-10-20T12:00:00", 50, HQ, 100], ["2026-10-20T12:00:00", 100, WEB, 0],
               ["2026-10-20T12:00:00", 600, HQ, 1600], ["2026-10-20T12:00:00", 100, HQ, 0]]
      - member: {tier_class: Silver}
        bits: [["2026-10-20T12:00:00", 100, HQ, 0]]
      - member: {tier_class: GOLD}
        note: "band edges, fresh cap"
        bits: [["2026-10-20T12:00:00", 99.99, HQ, 199.98], ["2026-10-20T12:00:00", 49.99, HQ, 0]]

  - id: H02_or_once
    prompt: "100 bonus points on any spend at the Vijayawada store, or on any spend over $500 anywhere."
    sequences:
      - bits: [["2026-10-20T12:00:00", 10, VJD, 100], ["2026-10-20T12:00:00", 501, HQ, 100], ["2026-10-20T12:00:00", 600, VJD, 100],
               ["2026-10-20T12:00:00", 500, HQ, 0]]
      - note: "neither branch"
        bits: [["2026-10-20T12:00:00", 10, HQ, 0], ["2026-10-20T12:00:00", 500, WEB, 0]]

  - id: H03_and_of_or_privilege
    prompt: "On weekends, spends over $60 or any spend at the online store earn a free 2 hours of yoga session."
    sequences:
      - bits: [["2026-10-24T12:00:00", 61, HQ, "37"], ["2026-10-24T12:00:00", 10, WEB, "37"], ["2026-10-24T12:00:00", 70, WEB, "37"],
               ["2026-10-20T12:00:00", 70, WEB, null]]
      - note: "edges: $60 is not over $60, Sunday is a weekend day, weekday over $60"
        bits: [["2026-10-24T12:00:00", 60, HQ, null], ["2026-10-25T12:00:00", 61, HQ, "37"], ["2026-10-20T12:00:00", 61, HQ, null]]

  - id: H04_or_of_and_groups
    prompt: "100 bonus points for Gold members spending at the Chennai HQ store, or for Silver members spending over $500 anywhere."
    sequences:
      - member: {tier_class: GOLD}
        bits: [["2026-10-20T12:00:00", 10, HQ, 100], ["2026-10-20T12:00:00", 600, WEB, 0]]
      - member: {tier_class: Silver}
        bits: [["2026-10-20T12:00:00", 600, WEB, 100], ["2026-10-20T12:00:00", 10, HQ, 0]]
      - member: {tier_class: GOLD}
        note: "Gold elsewhere"
        bits: [["2026-10-20T12:00:00", 10, WEB, 0]]
      - member: {tier_class: Silver}
        note: "Silver $500 edge"
        bits: [["2026-10-20T12:00:00", 500, WEB, 0], ["2026-10-20T12:00:00", 501, WEB, 100]]

  - id: H05_three_way_or
    prompt: "Double points on spends at the online store, on Sundays, or on spends over $1000."
    sequences:
      - bits: [["2026-10-20T12:00:00", 10, WEB, 20], ["2026-10-25T12:00:00", 10, HQ, 20], ["2026-10-20T12:00:00", 1001, HQ, 2002],
               ["2026-10-20T12:00:00", 10, HQ, 0]]
      - note: "edges: $1000 is not over, Saturday is not Sunday"
        bits: [["2026-10-20T12:00:00", 1000, HQ, 0], ["2026-10-24T12:00:00", 10, HQ, 0]]

  - id: H06_nested_or_and_or
    prompt: "50 bonus points when (a Gold member spends on a weekend at either the Chennai HQ or Vijayawada store) or (any member spends over $800)."
    sequences:
      - member: {tier_class: GOLD}
        bits: [["2026-10-24T12:00:00", 10, VJD, 50], ["2026-10-24T12:00:00", 10, WEB, 0], ["2026-10-20T12:00:00", 801, WEB, 50]]
      - member: {tier_class: Silver}
        bits: [["2026-10-24T12:00:00", 10, HQ, 0], ["2026-10-20T12:00:00", 900, HQ, 50]]
      - member: {tier_class: GOLD}
        note: "Gold: other named store, Sunday, weekday, $800 edge"
        bits: [["2026-10-24T12:00:00", 10, HQ, 50], ["2026-10-25T12:00:00", 10, VJD, 50], ["2026-10-20T12:00:00", 10, HQ, 0],
               ["2026-10-20T12:00:00", 800, WEB, 0]]

  - id: H07_deep_nesting
    prompt: "A complimentary voucher when (the spend is at the online store and over $20) or (it is a Friday and the member is Silver)."
    probe: [0, 0]   # Gold, Tuesday, $21 online: pays only through the store branch
    sequences:
      - member: {tier_class: GOLD}
        bits: [["2026-10-20T12:00:00", 21, WEB, "64"], ["2026-10-20T12:00:00", 20, WEB, null], ["2026-10-23T12:00:00", 5, HQ, null]]
      - member: {tier_class: Silver}
        bits: [["2026-10-23T12:00:00", 5, HQ, "64"]]
      - member: {tier_class: Silver}
        note: "Silver on Thursday, Silver Friday online"
        bits: [["2026-10-22T12:00:00", 5, HQ, null], ["2026-10-23T12:00:00", 5, WEB, "64"]]
      - member: {tier_class: GOLD}
        note: "Gold on Friday over $20 elsewhere"
        bits: [["2026-10-23T12:00:00", 21, HQ, null]]

  - id: H08_nth_by_tier_privilege
    prompt: "Every 3rd spend by Silver members earns a free 2 hours of yoga session."
    sequences:
      - member: {tier_class: Silver}
        bits: [["2026-10-20T12:00:00", 20, HQ, null], ["2026-10-21T12:00:00", 20, HQ, null], ["2026-10-22T12:00:00", 20, HQ, "37"],
               ["2026-10-23T12:00:00", 20, HQ, null], ["2026-10-24T12:00:00", 20, HQ, null], ["2026-10-25T12:00:00", 20, HQ, "37"]]
      - member: {tier_class: GOLD}
        bits: [["2026-10-20T12:00:00", 20, HQ, null], ["2026-10-21T12:00:00", 20, HQ, null], ["2026-10-22T12:00:00", 20, HQ, null]]

  - id: H09_base_earn_plus_weekend_bonus
    prompt: "1 point per $1 on all spends, plus 100 bonus points on weekend spends."
    sequences:
      - bits: [["2026-10-24T12:00:00", 30, HQ, 130], ["2026-10-20T12:00:00", 30, HQ, 30]]
      - note: "Sunday and Friday"
        bits: [["2026-10-25T12:00:00", 30, HQ, 130], ["2026-10-23T12:00:00", 30, HQ, 30]]

  - id: H10_milestone_privilege_tier
    prompt: "Gold members whose total spend reaches $500 get a complimentary voucher, once."
    sequences:
      - member: {tier_class: GOLD}
        bits: [["2026-10-20T12:00:00", 300, HQ, null], ["2026-10-21T12:00:00", 200, HQ, "64"], ["2026-10-22T12:00:00", 500, HQ, null]]
      - member: {tier_class: GOLD}
        note: "exactly $500 in total"
        bits: [["2026-10-20T12:00:00", 499, HQ, null], ["2026-10-21T12:00:00", 1, HQ, "64"]]
      - member: {tier_class: Silver}
        note: "not Gold"
        bits: [["2026-10-20T12:00:00", 600, HQ, null]]

  - id: H11_unique_stores_from_list
    prompt: "Spend at 2 different stores among the Chennai HQ store, Vijayawada and the online store to earn 250 points, once."
    sequences:
      - bits: [["2026-10-20T12:00:00", 20, HQ, 0], ["2026-10-21T12:00:00", 20, Chennai, 0], ["2026-10-22T12:00:00", 20, VJD, 250],
               ["2026-10-23T12:00:00", 20, WEB, 0]]
      - note: "the same store twice is one store"
        bits: [["2026-10-20T12:00:00", 20, HQ, 0], ["2026-10-21T12:00:00", 20, HQ, 0], ["2026-10-22T12:00:00", 20, WEB, 250]]

  - id: H12_rate_by_tier
    prompt: "Gold members earn 3 points per $1, Silver members 2 points per $1, everyone else 1 point per $1."
    sequences:
      - member: {tier_class: GOLD}
        bits: [["2026-10-20T12:00:00", 10, HQ, 30]]
      - member: {tier_class: Silver}
        bits: [["2026-10-20T12:00:00", 10, HQ, 20]]
      - member: {tier_class: Basic}
        bits: [["2026-10-20T12:00:00", 10, HQ, 10]]
      - member: {tier_class: Silver}
        note: "other amount"
        bits: [["2026-10-20T12:00:00", 25, HQ, 50]]

  - id: H13_store_day_hour
    prompt: "3x points on spends at the online store between 5pm and 7pm on Fridays."
    sequences:
      - bits: [["2026-10-23T17:30:00", 10, WEB, 30], ["2026-10-23T19:00:00", 10, WEB, 0], ["2026-10-23T17:30:00", 10, HQ, 0],
               ["2026-10-22T17:30:00", 10, WEB, 0]]
      - note: "edges: 5pm in, 6:59pm in, 4:59pm out"
        bits: [["2026-10-23T17:00:00", 10, WEB, 30], ["2026-10-23T18:59:00", 10, WEB, 30], ["2026-10-23T16:59:00", 10, WEB, 0]]

  - id: H14_formula
    prompt: "Points = 2 x the spend amount + 50 on every spend."
    sequences:
      - bits: [["2026-10-20T12:00:00", 10, HQ, 70]]
      - note: "other amounts"
        bits: [["2026-10-20T12:00:00", 25, HQ, 100], ["2026-10-20T12:00:00", 1, HQ, 52]]

  # ================================================================ complex scenarios (design: ~/Documents/Gravty/ai-agent/ComplexScenarios.md)
  # expect may be {points: n, privilege: id | privileges: [ids]} (several rewards on one BIT, graded exactly). Member dates
  # are ISO dates; the hosted run shifts them with the BITs. `hosted: false` = local only (year boundary, or longer than
  # the hosted offer). `probe_expect` = what other stores earn (same = the probe BIT's own reward) when the named store is
  # an exclusion or other stores earn a base rate. Member and BIT years avoid leap-year day-of-year shifts (see the doc).
  - id: C01_birthday_window_once_per_occurrence
    prompt: "500 bonus points on a spend of $50 or more made within 15 days before or after the member's birthday, at most once per birthday."
    sequences:
      - member: {date_of_birth: "1990-11-20"}
        note: "day -16, $49.99 on day -15, day -15 pays, then nothing more for this birthday"
        bits: [["2026-11-04T10:00:00", 80, HQ, 0], ["2026-11-05T09:00:00", 49.99, HQ, 0], ["2026-11-05T09:00:00", 50, VJD, 500],
               ["2026-11-20T12:00:00", 200, HQ, 0], ["2026-11-24T12:00:00", 90, WEB, 0]]
      - member: {date_of_birth: "1991-11-05"}
        note: "day +15, late evening"
        bits: [["2026-11-20T23:30:00", 60, WEB, 500]]
      - member: {date_of_birth: "1991-11-04"}
        note: "day +16"
        bits: [["2026-11-20T08:00:00", 60, HQ, 0]]
      - member: {date_of_birth: "1987-01-05"}
        hosted: false
        note: "year boundary: 21 Dec is day -15 of next year's birthday; 4 and 20 Jan are the same birthday; 21 Dec 2027 is the next one"
        bits: [["2026-12-21T10:00:00", 50, HQ, 500], ["2027-01-04T10:00:00", 70, HQ, 0], ["2027-01-20T10:00:00", 70, HQ, 0],
               ["2027-12-21T10:00:00", 70, HQ, 500]]
      - member: {date_of_birth: "1985-12-28"}
        hosted: false
        note: "day +15 across New Year"
        bits: [["2027-01-12T10:00:00", 60, HQ, 500]]
      - member: {date_of_birth: "1985-12-28"}
        hosted: false
        note: "day +16 across New Year, then day -15 of the next birthday"
        bits: [["2027-01-13T10:00:00", 60, HQ, 0], ["2027-12-13T10:00:00", 60, HQ, 500]]

  - id: C02_birthday_month_tier_rates_voucher
    prompt: "In the member's birthday month, Gold members earn 3 points per $1 and all other members 2 points per $1 on every spend; in other months every member earns 1 point per $1. The first spend of $100 or more in a birthday month also earns a complimentary voucher, once per year."
    sequences:
      - member: {date_of_birth: "1990-11-15"}
        hosted: false
        note: "month edges, voucher once in the month, again next year"
        bits: [["2026-10-31T23:00:00", 100, HQ, 100], ["2026-11-01T00:30:00", 50, HQ, 150], ["2026-11-02T12:00:00", 100, HQ, {points: 300, privilege: "64"}],
               ["2026-11-30T12:00:00", 120, HQ, 360], ["2026-12-01T12:00:00", 10, HQ, 10], ["2027-11-03T12:00:00", 150, HQ, {points: 450, privilege: "64"}]]
      - member: {tier_class: Silver, date_of_birth: "1993-11-15"}
        note: "$99.99 earns no voucher; the next $100 does; not again"
        bits: [["2026-11-10T12:00:00", 99.99, HQ, 199.98], ["2026-11-11T12:00:00", 100, HQ, {points: 200, privilege: "64"}],
               ["2026-11-12T12:00:00", 100, VJD, 200]]
      - member: {tier_class: Basic, date_of_birth: "1988-02-29"}
        hosted: false
        note: "29 Feb birthday: February in a non-leap year"
        bits: [["2027-02-28T12:00:00", 100, HQ, {points: 200, privilege: "64"}], ["2027-03-01T12:00:00", 100, HQ, 100]]

  - id: C03_marginal_bands_daily_cap
    prompt: "Gold members earn 2 points per $1 on the first $200 of a spend and 3 points per $1 on the part of the spend above $200; all other members earn 1 point per $1. A member earns at most 1000 points per calendar day from this offer: a spend that reaches the cap earns only the points left under it."
    sequences:
      - note: "700, then the remainder 300, then 0; next day resets: 200, then 800 of 1000"
        bits: [["2026-11-03T09:00:00", 300, HQ, 700], ["2026-11-03T12:00:00", 200, HQ, 300], ["2026-11-03T18:00:00", 50, HQ, 0],
               ["2026-11-04T09:00:00", 100, HQ, 200], ["2026-11-04T10:00:00", 400, HQ, 800]]
      - member: {tier_class: Silver}
        bits: [["2026-11-03T09:00:00", 1200, VJD, 1000], ["2026-11-03T20:00:00", 5, VJD, 0], ["2026-11-04T08:00:00", 5, VJD, 5]]
      - note: "band edge"
        bits: [["2026-11-05T09:00:00", 200, WEB, 400], ["2026-11-05T10:00:00", 200.5, WEB, 401.5]]

  - id: C04_weekly_streak
    prompt: "A member who spends $25 or more in each of 3 consecutive calendar weeks (Monday to Sunday) earns a free 2 hours of yoga session. A week without such a spend starts the count again, and so does the reward."
    sequences:
      - note: "two spends in one week count once; Sunday then Monday are two weeks; the count restarts after the reward"
        bits: [["2026-11-02T12:00:00", 30, HQ, null], ["2026-11-04T12:00:00", 40, HQ, null], ["2026-11-15T20:00:00", 25, HQ, null],
               ["2026-11-16T09:00:00", 26, HQ, "37"], ["2026-11-23T12:00:00", 30, HQ, null]]
      - hosted: false
        note: "a $24.99 week does not count, so the count restarts"
        bits: [["2026-11-02T12:00:00", 30, HQ, null], ["2026-11-09T12:00:00", 24.99, HQ, null], ["2026-11-16T12:00:00", 30, HQ, null],
               ["2026-11-23T12:00:00", 30, HQ, null], ["2026-11-30T12:00:00", 30, HQ, "37"]]

  - id: C05_nth_qualifying_excluding_online_by_tier
    prompt: "Every 3rd spend of $40 or more earns 150 bonus points; for Silver members every 2nd such spend. Spends at the online store never count and never earn."
    probe_expect: same
    sequences:
      - note: "$39.99 and online spends do not count"
        bits: [["2026-11-03T10:00:00", 40, HQ, 0], ["2026-11-03T11:00:00", 39.99, HQ, 0], ["2026-11-03T12:00:00", 100, WEB, 0],
               ["2026-11-03T13:00:00", 50, VJD, 0], ["2026-11-03T14:00:00", 40, Chennai, 150], ["2026-11-03T15:00:00", 40, HQ, 0],
               ["2026-11-03T16:00:00", 40, HQ, 0], ["2026-11-03T17:00:00", 40, HQ, 150]]
      - member: {tier_class: Silver}
        bits: [["2026-11-03T10:00:00", 40, HQ, 0], ["2026-11-03T11:00:00", 40, WEB, 0], ["2026-11-03T12:00:00", 45, VJD, 150],
               ["2026-11-03T13:00:00", 45, VJD, 0], ["2026-11-03T14:00:00", 45, VJD, 150]]

  - id: C06_lunch_hours_store_tier_stacking
    prompt: "On weekdays from 11am until 2pm, spends at the Chennai HQ or Vijayawada store earn 2 points per $1, and Gold members earn 3 points per $1 there instead; a spend over $300 in that window also earns 100 bonus points. Every other spend earns 1 point per $1."
    probe: [1, 0]
    probe_expect: 100
    sequences:
      - note: "11:00 in, 13:59 in with the bonus, 14:00 and 10:59 out, Saturday, online store, $300 is not over $300"
        bits: [["2026-11-03T11:00:00", 100, HQ, 300], ["2026-11-03T13:59:00", 301, VJD, 1003], ["2026-11-03T14:00:00", 100, HQ, 100],
               ["2026-11-03T10:59:00", 100, HQ, 100], ["2026-11-07T12:00:00", 400, HQ, 400], ["2026-11-03T12:00:00", 400, WEB, 400],
               ["2026-11-03T12:00:00", 300, HQ, 900]]
      - member: {tier_class: Silver}
        bits: [["2026-11-03T12:00:00", 100, HQ, 200], ["2026-11-03T12:00:00", 350, Chennai, 350], ["2026-11-04T12:30:00", 350, VJD, 800]]

  - id: C07_anniversary_and_birthday_windows
    prompt: "Within 7 days before or after the member's wedding anniversary, a spend earns a complimentary voucher; within 15 days before or after their birthday, a spend earns 300 bonus points. Each reward at most once per anniversary or birthday; a spend inside both windows earns both."
    sequences:
      - member: {date_of_birth: "1990-11-20", wedding_anniversary: "2015-11-15"}
        note: "birthday window first; anniversary day -8 out, day -7 in"
        bits: [["2026-11-07T12:00:00", 50, HQ, 300], ["2026-11-08T12:00:00", 50, HQ, "64"], ["2026-11-09T12:00:00", 50, HQ, null]]
      - member: {date_of_birth: "1990-11-20", wedding_anniversary: "2015-11-18"}
        note: "both windows on one spend, then both used"
        bits: [["2026-11-12T12:00:00", 50, HQ, {points: 300, privilege: "64"}], ["2026-11-24T12:00:00", 50, HQ, null]]
      - member: {date_of_birth: "1989-12-31", wedding_anniversary: "2017-11-10"}
        note: "anniversary only: day -8, day -7, day +7 after the reward"
        bits: [["2026-11-02T12:00:00", 50, HQ, null], ["2026-11-03T12:00:00", 50, HQ, "64"], ["2026-11-17T12:00:00", 50, HQ, null]]
      - member: {date_of_birth: "1990-11-20"}
        note: "no anniversary on file"
        bits: [["2026-11-20T12:00:00", 50, HQ, 300]]
      - member: {date_of_birth: "1990-06-01"}
        hosted: false
        note: "no anniversary on file: early January must not match (a missing date reads as day -1)"
        bits: [["2027-01-03T12:00:00", 50, HQ, null]]

  - id: C08_repeat_thresholds_online_double
    prompt: "Every time a member's cumulative spend reaches another $1000 ($1000, $2000, $3000, and so on), they earn 500 bonus points; a spend that passes two of these marks earns 1000. Spends at the online store count double toward the cumulative spend."
    probe_expect: same
    sequences:
      - note: "totals 600, 1000, 1999, 2000, 4200 (online $1100 counts 2200: two marks), 4999.99"
        bits: [["2026-11-03T10:00:00", 600, HQ, 0], ["2026-11-03T11:00:00", 400, HQ, 500], ["2026-11-03T12:00:00", 999, HQ, 0],
               ["2026-11-03T13:00:00", 1, HQ, 500], ["2026-11-03T14:00:00", 1100, WEB, 1000], ["2026-11-03T15:00:00", 799.99, HQ, 0]]
      - note: "two marks at once, then online $250 counts 500 and reaches $3000"
        bits: [["2026-11-04T10:00:00", 2500, VJD, 1000], ["2026-11-04T11:00:00", 250, WEB, 500]]

  - id: C09_tier_groups_different_caps
    prompt: "Gold and Silver members spending $100 or more at any store except the online store earn 200 bonus points, at most 3 times per member. Other members earn the same 200 points only for spends of $100 or more on Sundays, at most once."
    probe_expect: same
    sequences:
      - note: "$99.99 and online do not pay; the 4th reward is refused"
        bits: [["2026-11-03T12:00:00", 100, HQ, 200], ["2026-11-03T12:00:00", 99.99, HQ, 0], ["2026-11-03T12:00:00", 500, WEB, 0],
               ["2026-11-04T12:00:00", 100, VJD, 200], ["2026-11-05T12:00:00", 100, Chennai, 200], ["2026-11-06T12:00:00", 100, HQ, 0]]
      - member: {tier_class: Basic}
        note: "weekday refused, first Sunday pays, second Sunday refused"
        bits: [["2026-11-03T12:00:00", 100, HQ, 0], ["2026-11-08T12:00:00", 100, HQ, 200], ["2026-11-15T12:00:00", 100, HQ, 0]]
      - member: {tier_class: Silver}
        note: "Silver on Sundays is in the first group (no once limit)"
        bits: [["2026-11-08T12:00:00", 100, VJD, 200], ["2026-11-15T12:00:00", 100, VJD, 200]]

  - id: C10_new_member_windows
    prompt: "New members earn 5 points per $1 on their first 2 spends made within 30 days of joining. From day 31 to day 90 after joining, spends over $50 earn 2 points per $1. No other spend earns from this offer."
    sequences:
      - member: {date_of_joining: "2026-10-25"}
        note: "only the first 2 spends in the first 30 days"
        bits: [["2026-11-03T12:00:00", 10, HQ, 50], ["2026-11-10T12:00:00", 20, HQ, 100], ["2026-11-20T12:00:00", 20, HQ, 0]]
      - member: {date_of_joining: "2026-10-05"}
        note: "day 30 in the first window, day 31 in the second, $50 is not over $50"
