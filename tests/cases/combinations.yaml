# Combination test cases: several features in one offer, and nested AND / OR logic.
# Same tenant, BIT defaults and expect keys as logic.yaml. Cases with sequences are also checked in the engine.

cases:

  # ---------------------------------------------------------------- features stacked in one offer
  - id: C01_tier_store_bands_cap
    prompt: "Gold members spending $100 or more at the Downtown store earn 3x points, $50 to $99.99 earns 2x, with a maximum of 2000 bonus points per member."
    expect: {status: [draft], features: [obj:member, obj:activity, op:in, "op:>=", act:give_points, act:update_attribute]}
    sequences:
      - bits:
          - {h_location: L1, h_bit_amount: 100, expect: {points: 300}}
          - {h_location: L1, h_bit_amount: 50,  expect: {points: 100}}
          - {h_location: L2, h_bit_amount: 100, expect: {points: 0}}
          - {h_location: L1, h_bit_amount: 600, expect: {points: 1600}}   # 300+100+1600 = 2000 cap
          - {h_location: L1, h_bit_amount: 100, expect: {points: 0}}
      - member_override: {tier: SILVER}
        bits: [{h_location: L1, h_bit_amount: 100, expect: {points: 0}}]

  - id: C02_line_item_plus_header_bonus
    prompt: "5 points per Drinks item, plus 50 bonus points when the whole spend is over $40."
    expect: {status: [draft], features: [block:rule_line, block:rule, obj:products_attrs, obj:activity]}
    sequences:
      - bits:
          - {h_bit_amount: 41, lines: [{sku: DRK-1, qty: 2, amount: 8}, {sku: BAK-1, qty: 1, amount: 33}], expect: {points: 60}}
          - {h_bit_amount: 10, lines: [{sku: DRK-1, qty: 1, amount: 4}, {sku: SNK-1, qty: 1, amount: 6}], expect: {points: 5}}

  - id: C03_anniversary_store_privilege
    prompt: "A Free Coffee voucher for a spend at the Mall store within 7 days of the member's enrolment anniversary, once a year."
    expect: {status: [draft, needs_input], features: [block:arithmetic_date, block:member_attribute, act:give_privilege, op:in]}
    sequences:
      - member_override: {enrollment_date: "2021-08-10"}
        bits:
          - {h_location: L2, h_bit_date: "2026-08-05T10:00:00", expect: {privilege: 501}}
          - {h_location: L2, h_bit_date: "2026-08-12T10:00:00", expect: {privilege: null}}   # once this year
          - {h_location: L1, h_bit_date: "2027-08-10T10:00:00", expect: {privilege: null}}   # wrong store
          - {h_location: L2, h_bit_date: "2027-08-11T10:00:00", expect: {privilege: 501}}

  - id: C04_nth_by_tier_privilege
    prompt: "Every 5th spend by Silver members earns a Free Coffee voucher."
    expect: {status: [draft], features: [obj:member, act:give_privilege, counter:REGULAR]}
    sequences:
      - member_override: {tier: SILVER}
        bits: [{expect: {privilege: null}}, {expect: {privilege: null}}, {expect: {privilege: null}}, {expect: {privilege: null}},
               {expect: {privilege: 501}}]

  - id: C05_unlock_for_tier
    prompt: "Gold members who make a booking unlock 2x points on their later spends."
    expect: {status: [draft], features: [obj:member, act:update_attribute]}
    sequences:
      - bits:
          - {h_bit_type: SPEND,   h_bit_amount: 10, expect: {points: 0}}
          - {h_bit_type: BOOKING, h_bit_amount: 10, expect: {points: 0}}
          - {h_bit_type: SPEND,   h_bit_amount: 10, expect: {points: 20}}

  - id: C06_base_earn_plus_weekend_bonus
    prompt: "1 point per $1 on all spends, plus 100 bonus points on weekend spends."
    expect: {status: [draft]}
    sequences:
      - bits:
          - {h_bit_date: "2026-10-24T12:00:00", h_bit_amount: 30, expect: {points: 130}}
          - {h_bit_date: "2026-10-20T12:00:00", h_bit_amount: 30, expect: {points: 30}}

  - id: C07_milestone_privilege_gold
    prompt: "Gold members whose total spend reaches $500 get a Free Coffee voucher, once."
    expect: {status: [draft], features: [obj:member, act:give_privilege]}
    sequences:
      - bits:
          - {h_bit_amount: 300, expect: {privilege: null}}
          - {h_bit_amount: 200, expect: {privilege: 501}}
          - {h_bit_amount: 500, expect: {privilege: null}}

  - id: C08_line_item_with_cap
    prompt: "10 points per Bakery item, capped at 100 bonus points per member."
    expect: {status: [draft, needs_input], features: [block:rule_line]}
    sequences:
      - bits:
          - {lines: [{sku: BAK-1, qty: 6, amount: 30}], expect: {points: 60}}
          - {lines: [{sku: BAK-1, qty: 6, amount: 30}], expect: {points: 40}}
          - {lines: [{sku: BAK-1, qty: 1, amount: 5}],  expect: {points: 0}}

  - id: C09_unique_stores_from_list
    prompt: "Spend at 2 different stores among Downtown, Mall and Harbour to earn 250 points, once."
    expect: {status: [draft], features: [counter:VECTOR, op:in]}
    sequences:
      - bits:
          - {h_location: L1,  expect: {points: 0}}
          - {h_location: AP1, expect: {points: 0}}    # not in the list
          - {h_location: L2,  expect: {points: 250}}

  - id: C10_collect_all_plus_earn
    prompt: "1 point per $1 on every spend, and buying from all of Snacks, Drinks and Bakery earns a Free Coffee voucher once."
    expect: {status: [draft], features: [block:rule_line, act:give_privilege, act:give_points]}
    sequences:
      - bits:
          - {h_bit_amount: 4, lines: [{sku: SNK-1, qty: 1, amount: 2}, {sku: DRK-1, qty: 1, amount: 2}], expect: {points: 4, privilege: null}}
          - {h_bit_amount: 5, lines: [{sku: BAK-1, qty: 1, amount: 5}], expect: {points: 5, privilege: 501}}

  - id: C11_nth_on_weekends
    prompt: "Count each member's spends made on a Saturday or Sunday; every 2nd such weekend spend (the 2nd, 4th, 6th, ...) earns 150 bonus points. Weekday spends are not counted and earn nothing."
    expect: {status: [draft]}
    sequences:
      - bits:
          - {h_bit_date: "2026-10-24T12:00:00", expect: {points: 0}}
          - {h_bit_date: "2026-10-20T12:00:00", expect: {points: 0}}    # weekday: does not count
          - {h_bit_date: "2026-10-25T12:00:00", expect: {points: 150}}

  - id: C12_unlock_with_cap
    prompt: "After a hotel stay, bookings earn 2x points, up to 1000 bonus points per member."
    expect: {status: [draft, needs_input]}
    sequences:
      - bits:
          - {h_bit_type: STAY,    h_bit_amount: 100, expect: {points: 0}}
          - {h_bit_type: BOOKING, h_bit_amount: 400, expect: {points: 800}}
          - {h_bit_type: BOOKING, h_bit_amount: 400, expect: {points: 200}}

  # ---------------------------------------------------------------- AND / OR nesting
  - id: C13_and_of_or_weekend_amount_or_store
    prompt: "On weekends, spends over $60 or any spend at the Harbour store earn a Free Coffee voucher."
    expect: {status: [draft], features: [block:or, act:give_privilege]}
    sequences:
      - bits:
          - {h_bit_date: "2026-10-24T12:00:00", h_location: L1, h_bit_amount: 61, expect: {privilege: 501}}
          - {h_bit_date: "2026-10-24T12:00:00", h_location: L3, h_bit_amount: 10, expect: {privilege: 501}}
          - {h_bit_date: "2026-10-24T12:00:00", h_location: L3, h_bit_amount: 70, expect: {privilege: 501}}   # once
          - {h_bit_date: "2026-10-20T12:00:00", h_location: L3, h_bit_amount: 70, expect: {privilege: null}}

  - id: C14_or_of_and_groups
    prompt: "100 bonus points for Gold members spending at the Downtown store, or for Silver members spending over $500 anywhere."
    expect: {status: [draft], features: [block:or, obj:member]}
    sequences:
      - bits:
          - {h_location: L1, h_bit_amount: 10, expect: {points: 100}}
          - {h_location: L2, h_bit_amount: 600, expect: {points: 0}}
      - member_override: {tier: SILVER}
        bits:
          - {h_location: L2, h_bit_amount: 600, expect: {points: 100}}
          - {h_location: L1, h_bit_amount: 10,  expect: {points: 0}}

  - id: C15_three_way_or
    prompt: "Double points on spends at the Airport T1 store, on Sundays, or on spends over $1000."
    expect: {status: [draft], features: [block:or]}
    sequences:
      - bits:
          - {h_location: AP1, h_bit_amount: 10, expect: {points: 20}}
          - {h_bit_date: "2026-10-25T12:00:00", h_bit_amount: 10, expect: {points: 20}}
          - {h_bit_amount: 1001, expect: {points: 2002}}
          - {h_bit_amount: 10, expect: {points: 0}}

  - id: C16_nested_or_inside_and_inside_or
    prompt: "50 bonus points when (a Gold member spends on a weekend at either the Downtown or Mall store) or (any member spends over $800)."
    expect: {status: [draft], features: [block:or]}
    sequences:
      - bits:
          - {h_bit_date: "2026-10-24T12:00:00", h_location: L2, h_bit_amount: 10, expect: {points: 50}}
          - {h_bit_date: "2026-10-24T12:00:00", h_location: L3, h_bit_amount: 10, expect: {points: 0}}
          - {h_bit_date: "2026-10-20T12:00:00", h_location: L3, h_bit_amount: 801, expect: {points: 50}}
      - member_override: {tier: BLUE}
        bits:
          - {h_bit_date: "2026-10-24T12:00:00", h_location: L1, h_bit_amount: 10, expect: {points: 0}}

  - id: C17_deep_nesting
    prompt: "Free Coffee voucher when ((the spend is at the Harbour store and over $20) or (it is a Friday and the member is Silver)) and the activity is not a redemption."
    expect: {status: [draft], features: [block:or, act:give_privilege]}
    sequences:
      - bits:
          - {h_location: L3, h_bit_amount: 21, expect: {privilege: 501}}
          - {h_location: L3, h_bit_amount: 20, expect: {privilege: null}}
          - {h_bit_type: REDEMPTION, h_location: L3, h_bit_amount: 50, expect: {privilege: null}}
      - member_override: {tier: SILVER}
        bits:
          - {h_bit_date: "2026-10-23T12:00:00", h_location: L1, h_bit_amount: 5, expect: {privilege: 501}}

  # ---------------------------------------------------------------- formulas and field-vs-field comparisons
  - id: C18_formula_points
    prompt: "Points = 2 x the spend amount + 50 on every spend."
    expect: {status: [draft], features: [block:arithmetic_generic]}
    sequences:
      - bits: [{h_bit_amount: 10, expect: {points: 70}}]

  - id: C19_birthday_month_compare_fields
    prompt: "Members get 100 bonus points on any spend made in the same month as their birthday."
    expect: {status: [draft, needs_input]}
    sequences:
      - member_override: {date_of_birth: "1990-10-02"}
        bits:
          - {h_bit_date: "2026-10-20T10:00:00", expect: {points: 100}}
          - {h_bit_date: "2026-11-02T10:00:00", expect: {points: 0}}

  - id: C20_rate_by_tier_in_one_offer
    prompt: "Gold members earn 3 points per $1, Silver members 2 points per $1, everyone else 1 point per $1."
    expect: {status: [draft], features: [obj:member]}
    sequences:
      - bits: [{h_bit_amount: 10, expect: {points: 30}}]
      - member_override: {tier: SILVER}
        bits: [{h_bit_amount: 10, expect: {points: 20}}]
      - member_override: {tier: BLUE}
        bits: [{h_bit_amount: 10, expect: {points: 10}}]
