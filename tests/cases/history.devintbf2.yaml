    - ['2026-10-21T12:00:00', 20, HYD, '13828']
    - ['2026-10-22T12:00:00', 20, HYD, null]
    - ['2026-10-23T12:00:00', 20, HYD, '13828']
  - member: {tier_class: SLVR}
    bits:
    - ['2026-10-20T12:00:00', 20, HYD, null]
