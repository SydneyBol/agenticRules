# Earlier offers as reference (tools/qa/check_history.py). Run with the history built by tools/qa/build_history.py.
# Same format as hosted_combinations.devintbf2.yaml (BIT rows [date, amount, store, expect]), plus per case:
#   kind: contamination | convention | named
#   xml_has / xml_lacks: strings the rules XML must / must not hold
# contamination: a near copy of an earlier offer with other values; the earlier offer is shown, its values must not leak.
# convention: the description leaves a choice open; the tenant's earlier offers settle it (planted counter name).
# named: the manager names an earlier offer; it is part of the request.
cases:
- id: X01_bands_cap_other_values
  kind: contamination
  prompt: Gold members spending $200 or more at the Hyderabad store earn 4x points, $100 to $199.99 earns 2x, with a maximum of 3000 bonus points per member.
  sequences:
  - member: {tier_class: GLDGLW}
    bits:
    - ['2026-10-20T12:00:00', 200, HYD, 800]
    - ['2026-10-20T12:00:00', 100, HYD, 200]
    - ['2026-10-20T12:00:00', 200, AUTO5, 0]
    - ['2026-10-20T12:00:00', 600, HYD, 2000]
    - ['2026-10-20T12:00:00', 200, HYD, 0]
  - member: {tier_class: SLVR}
    bits:
    - ['2026-10-20T12:00:00', 200, HYD, 0]
  - member: {tier_class: GLDGLW}
    bits:
    - ['2026-10-20T12:00:00', 199.99, HYD, 399.98]
    - ['2026-10-20T12:00:00', 99.99, HYD, 0]
- id: X02_tier_rates_other_values
  kind: contamination
  prompt: Gold members earn 5 points per $1, Silver members 4 points per $1, everyone else 2 points per $1.
  sequences:
  - member: {tier_class: GLDGLW}
    bits: [['2026-10-20T12:00:00', 10, HYD, 50]]
  - member: {tier_class: SLVR}
    bits: [['2026-10-20T12:00:00', 10, HYD, 40]]
  - member: {tier_class: DIA}
    bits: [['2026-10-20T12:00:00', 10, HYD, 20]]
