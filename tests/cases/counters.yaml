# Very high-complexity counter scenarios: offer-level counters (MA_O, member-tracked attributes level OFFER, kept per
# member across transactions) and activity-level attributes (MA_A, member-tracked attributes level ACTIVITY: scratch
# values for ONE transaction, passed between rules in rule order; the engine keeps them in EngineMember
# tempAttributes and clears them per transaction).
#
# Same tenant, BIT defaults and expect keys as logic.yaml, plus per-BIT counter checks:
#   expect.mto: {<counter name>: value}  offer counter value AFTER this BIT (engine mto_after)
#   expect.mta: {<attribute name>: value} activity attribute value at the end of this BIT (engine mta_after_this_bit)
# Prompts name their counters, as a manager would, so the values can be checked by name.

cases:

  # ================================================================ MA_O: offer-level counters
  - id: M01_stamp_card_with_reset
    prompt: "Keep a stamp card in an offer counter called 'stamps': every spend of $10 or more adds 1 stamp. When the member reaches 10 stamps, give a Free Coffee voucher and reset 'stamps' to 0."
    expect: {status: [draft], features: [act:update_attribute, act:give_privilege, mode:attribute_level=MA_O, mode:action_operator=INCREMENT_BY, mode:action_operator=RESET]}
    sequences:
      - bits:
          - {expect: {privilege: null, mto: {stamps: 1}}}
          - {expect: {privilege: null, mto: {stamps: 2}}}
          - {expect: {privilege: null, mto: {stamps: 3}}}
          - {expect: {privilege: null, mto: {stamps: 4}}}
          - {expect: {privilege: null, mto: {stamps: 5}}}
          - {expect: {privilege: null, mto: {stamps: 6}}}
          - {expect: {privilege: null, mto: {stamps: 7}}}
          - {expect: {privilege: null, mto: {stamps: 8}}}
          - {expect: {privilege: null, mto: {stamps: 9}}}
          - {expect: {privilege: 501, mto: {stamps: 0}}}
          - {h_bit_amount: 5, expect: {privilege: null, mto: {stamps: 0}}}
          - {h_bit_amount: 12, expect: {privilege: null, mto: {stamps: 1}}}

  - id: M02_spend_ladder_two_milestones
    prompt: "Track each member's total spend in an offer counter 'offer spend'. Give 200 bonus points the first time it reaches $500 and another 500 bonus points the first time it reaches $1000. Each milestone pays only once."
    expect: {status: [draft], features: [act:update_attribute, mode:attribute_level=MA_O]}
    sequences:
      - bits:
          - {h_bit_amount: 300, expect: {points: 0,   mto: {offer spend: 300}}}
          - {h_bit_amount: 300, expect: {points: 200, mto: {offer spend: 600}}}
          - {h_bit_amount: 500, expect: {points: 500, mto: {offer spend: 1100}}}
          - {h_bit_amount: 200, expect: {points: 0,   mto: {offer spend: 1300}}}

  - id: M03_vector_per_store_once_each
    prompt: "Count each member's visits per store in a vector counter 'store visits'. The 3rd visit to any one store earns 150 points; each store pays this only once."
    expect: {status: [draft], features: [counter:VECTOR, mode:attribute_level=MA_O]}
    sequences:
      - bits:
          - {h_location: L1, expect: {points: 0}}
          - {h_location: L1, expect: {points: 0}}
          - {h_location: L2, expect: {points: 0}}
          - {h_location: L1, expect: {points: 150}}
          - {h_location: L2, expect: {points: 0}}
          - {h_location: L2, expect: {points: 150}}
          - {h_location: L1, expect: {points: 0}}
          - {h_location: L3, expect: {points: 0}}

  - id: M04_shared_cap_across_rules
    prompt: "Weekend spends earn 2 bonus points per $1 and weekday spends 1 bonus point per $1. Total bonus from both rules is capped at 500 per member; track it in an offer counter 'bonus given'."
    expect: {status: [draft], features: [mode:attribute_level=MA_O, act:give_points]}
    sequences:
      - bits:
          - {h_bit_date: "2026-10-24T12:00:00", h_bit_amount: 200, expect: {points: 400, mto: {bonus given: 400}}}
          - {h_bit_date: "2026-10-27T12:00:00", h_bit_amount: 200, expect: {points: 100, mto: {bonus given: 500}}}
          - {h_bit_date: "2026-10-31T12:00:00", h_bit_amount: 50,  expect: {points: 0,   mto: {bonus given: 500}}}

  - id: M05_earn_and_spend_credits
    prompt: "Each spend over $25 adds 1 to an offer counter 'coffee credits'. Each redemption activity uses one credit (decrease by 1) and, only if the member had a credit, gives a Free Coffee voucher."
    expect: {status: [draft], features: [mode:action_operator=INCREMENT_BY, mode:action_operator=DECREMENT_BY, act:give_privilege]}
    sequences:
      - bits:
          - {h_bit_amount: 30, expect: {privilege: null, mto: {coffee credits: 1}}}
          - {h_bit_type: REDEMPTION, expect: {privilege: 501, mto: {coffee credits: 0}}}
          - {h_bit_type: REDEMPTION, expect: {privilege: null, mto: {coffee credits: 0}}}
          - {h_bit_amount: 20, expect: {privilege: null, mto: {coffee credits: 0}}}
          - {h_bit_amount: 26, expect: {privilege: null, mto: {coffee credits: 1}}}

  - id: M06_consecutive_streak_resets
    prompt: "Count consecutive spends over $50 in an offer counter 'hot streak'; a spend of $50 or less resets it to 0. On the 3rd consecutive qualifying spend give 300 bonus points and reset the streak to 0."
    expect: {status: [draft], features: [mode:action_operator=RESET, mode:action_operator=INCREMENT_BY]}
    sequences:
      - bits:
          - {h_bit_amount: 60, expect: {points: 0,   mto: {hot streak: 1}}}
          - {h_bit_amount: 70, expect: {points: 0,   mto: {hot streak: 2}}}
          - {h_bit_amount: 40, expect: {points: 0,   mto: {hot streak: 0}}}
          - {h_bit_amount: 60, expect: {points: 0,   mto: {hot streak: 1}}}
          - {h_bit_amount: 60, expect: {points: 0,   mto: {hot streak: 2}}}
          - {h_bit_amount: 60, expect: {points: 300, mto: {hot streak: 0}}}

  - id: M07_status_state_machine
    prompt: "Members earn 1 point per $1. Keep an offer counter 'spend count' and a text offer attribute 'status': after their 3rd spend status becomes SILVER and after their 6th spend it becomes GOLD. While status is SILVER they earn 1.5 points per $1 instead, and 2 points per $1 while GOLD. The status update happens after that spend's points."
    expect: {status: [draft], features: [mode:action_operator=SET, block:static_string_value, mode:attribute_level=MA_O]}
    sequences:
      - bits:
          - {h_bit_amount: 10, expect: {points: 10, mto: {spend count: 1}}}
          - {h_bit_amount: 10, expect: {points: 10, mto: {spend count: 2}}}
          - {h_bit_amount: 10, expect: {points: 10, mto: {spend count: 3, status: SILVER}}}
          - {h_bit_amount: 10, expect: {points: 15, mto: {spend count: 4, status: SILVER}}}
          - {h_bit_amount: 10, expect: {points: 15}}
          - {h_bit_amount: 10, expect: {points: 15, mto: {status: GOLD}}}
          - {h_bit_amount: 10, expect: {points: 20, mto: {status: GOLD}}}

  - id: M08_boost_next_n_activities
    prompt: "After a hotel stay, the member's next 2 bookings earn 3x points. Track the remaining boosted bookings in an offer counter 'boosted left': a stay sets it to 2 and each boosted booking decreases it by 1."
    expect: {status: [draft], features: [mode:action_operator=SET, mode:action_operator=DECREMENT_BY]}
    sequences:
      - bits:
          - {h_bit_type: BOOKING, h_bit_amount: 100, expect: {points: 0}}
          - {h_bit_type: STAY,    h_bit_amount: 50,  expect: {points: 0,   mto: {boosted left: 2}}}
          - {h_bit_type: BOOKING, h_bit_amount: 100, expect: {points: 300, mto: {boosted left: 1}}}
          - {h_bit_type: BOOKING, h_bit_amount: 100, expect: {points: 300, mto: {boosted left: 0}}}
          - {h_bit_type: BOOKING, h_bit_amount: 100, expect: {points: 0,   mto: {boosted left: 0}}}
          - {h_bit_type: STAY,    h_bit_amount: 50,  expect: {points: 0,   mto: {boosted left: 2}}}

  - id: M09_monthly_budget_with_vector_by_month
    prompt: "Give 10% bonus points on every spend, but at most 100 bonus points per member per calendar month: once a member has had 100 bonus points in a month, further spends that month earn only what is left of the 100, then nothing, and the allowance starts again the next month."
    expect: {status: [draft]}
    sequences:
      - bits:
          - {h_bit_date: "2026-10-05T12:00:00", h_bit_amount: 600, expect: {points: 60}}
          - {h_bit_date: "2026-10-10T12:00:00", h_bit_amount: 600, expect: {points: 40}}
          - {h_bit_date: "2026-10-20T12:00:00", h_bit_amount: 600, expect: {points: 0}}
          - {h_bit_date: "2026-11-02T12:00:00", h_bit_amount: 600, expect: {points: 60}}

  - id: M10_combined_ladder_streak_and_tier
    prompt: "Gold members only. Count their spends at the Downtown or Mall store in 'store spends'. Every 4th such spend gives 200 points, but if that 4th spend is also over $100 it gives a Free Coffee voucher instead of the points. Separately, once 'store spends' reaches 8, set the text attribute 'vip' to Yes. From the next spend on, while vip is Yes, every spend anywhere earns 2x points (2 points per $1); the spend that sets vip earns no 2x."
    expect: {status: [draft, needs_input], features: [obj:member, mode:attribute_level=MA_O, act:give_privilege, block:static_string_value]}
    sequences:
      - bits:
          - {h_location: L1, h_bit_amount: 10, expect: {points: 0, mto: {store spends: 1}}}
          - {h_location: L3, h_bit_amount: 10, expect: {points: 0, mto: {store spends: 1}}}
          - {h_location: L2, h_bit_amount: 10, expect: {points: 0, mto: {store spends: 2}}}
          - {h_location: L1, h_bit_amount: 10, expect: {points: 0, mto: {store spends: 3}}}
          - {h_location: L2, h_bit_amount: 10, expect: {points: 200, privilege: null, mto: {store spends: 4}}}
          - {h_location: L1, h_bit_amount: 10, expect: {points: 0}}
          - {h_location: L1, h_bit_amount: 10, expect: {points: 0}}
          - {h_location: L1, h_bit_amount: 10, expect: {points: 0}}
          - {h_location: L2, h_bit_amount: 150, expect: {points: 0, privilege: 501, mto: {store spends: 8, vip: "Yes"}}}
          - {h_location: L3, h_bit_amount: 10, expect: {points: 20}}
      - member_override: {tier: SILVER}
        bits: [{h_location: L1, h_bit_amount: 10, expect: {points: 0}}]

  # ================================================================ MA_A: activity-level (per transaction) attributes
  - id: A01_line_sum_into_activity_attribute
    prompt: "In each transaction, add up the amount of Snacks and Drinks lines into an activity-level attribute 'snack spend'. If 'snack spend' is at least $10, give 100 bonus points, once per transaction."
    expect: {status: [draft], features: [mode:attribute_level=MA_A, block:rule_line, act:update_attribute]}
    sequences:
      - bits:
          - {lines: [{sku: SNK-1, qty: 1, amount: 6}, {sku: DRK-1, qty: 1, amount: 4}], expect: {points: 100, mta: {snack spend: 10}}}
          - {lines: [{sku: SNK-1, qty: 1, amount: 6}, {sku: BAK-1, qty: 1, amount: 10}], expect: {points: 0, mta: {snack spend: 6}}}

  - id: A02_count_qualifying_lines_then_bonus
    prompt: "Per transaction, count the Bakery lines with quantity 2 or more in an activity-level attribute 'big bakery lines'. Give 20 points for each such line, plus 50 extra points when the transaction has 2 or more of them."
    expect: {status: [draft], features: [mode:attribute_level=MA_A, block:rule_line]}
    sequences:
      - bits:
          - {lines: [{sku: BAK-1, qty: 2, amount: 6}, {sku: BAK-1, qty: 3, amount: 9}], expect: {points: 90, mta: {big bakery lines: 2}}}
          - {lines: [{sku: BAK-1, qty: 1, amount: 3}, {sku: BAK-1, qty: 2, amount: 6}], expect: {points: 20, mta: {big bakery lines: 1}}}

  - id: A03_eligible_amount_excluding_category
    prompt: "Compute the eligible amount of each transaction in an activity-level attribute 'eligible': the transaction amount minus the amount of any Drinks lines. Give 2 points per $1 of the eligible amount."
    expect: {status: [draft], features: [mode:attribute_level=MA_A, block:arithmetic_generic]}
    sequences:
      - bits:
          - {h_bit_amount: 30, lines: [{sku: DRK-1, qty: 1, amount: 10}, {sku: SNK-1, qty: 1, amount: 20}], expect: {points: 40, mta: {eligible: 20}}}
          - {h_bit_amount: 15, lines: [{sku: BAK-1, qty: 1, amount: 15}], expect: {points: 30, mta: {eligible: 15}}}

  - id: A04_activity_attribute_feeds_offer_counter
    prompt: "Per transaction, total the quantity of Snacks items in an activity-level attribute 'snack qty' and add it to the offer counter 'snack total'. When 'snack total' reaches 10, give a Free Coffee voucher, once."
    expect: {status: [draft], features: [mode:attribute_level=MA_A, mode:attribute_level=MA_O, act:give_privilege]}
    sequences:
      - bits:
          - {lines: [{sku: SNK-1, qty: 4, amount: 8}], expect: {privilege: null, mta: {snack qty: 4}, mto: {snack total: 4}}}
          - {lines: [{sku: SNK-1, qty: 3, amount: 6}, {sku: SNK-2, qty: 2, amount: 4}], expect: {privilege: null, mto: {snack total: 9}}}
          - {lines: [{sku: SNK-2, qty: 1, amount: 2}], expect: {privilege: 501, mto: {snack total: 10}}}
          - {lines: [{sku: SNK-1, qty: 5, amount: 10}], expect: {privilege: null}}

  - id: A05_line_flag_gates_header_rule
    prompt: "If a transaction has any Bakery line, set the activity-level flag 'has bakery' to Yes. Then give 30 points only when 'has bakery' is Yes and the transaction amount is over $20."
    expect: {status: [draft], features: [mode:attribute_level=MA_A, block:static_string_value]}
    sequences:
      - bits:
          - {h_bit_amount: 25, lines: [{sku: BAK-1, qty: 1, amount: 5}, {sku: SNK-1, qty: 1, amount: 20}], expect: {points: 30, mta: {has bakery: "Yes"}}}
          - {h_bit_amount: 25, lines: [{sku: SNK-1, qty: 1, amount: 25}], expect: {points: 0}}
          - {h_bit_amount: 15, lines: [{sku: BAK-1, qty: 1, amount: 15}], expect: {points: 0}}

  - id: A06_per_transaction_tiered_by_computed_value
    prompt: "For each transaction compute 'basket points' (activity-level) = 1 point per $1 of Snacks lines + 2 points per $1 of Drinks lines. Then award 'basket points' x 2 if the transaction is on a weekend, otherwise award 'basket points' as is."
    expect: {status: [draft, needs_input], features: [mode:attribute_level=MA_A, block:arithmetic_generic]}
    sequences:
      - bits:
          - {h_bit_date: "2026-10-24T12:00:00", lines: [{sku: SNK-1, qty: 1, amount: 5}, {sku: DRK-1, qty: 1, amount: 5}], expect: {points: 30, mta: {basket points: 15}}}
          - {h_bit_date: "2026-10-20T12:00:00", lines: [{sku: SNK-1, qty: 1, amount: 5}, {sku: DRK-1, qty: 1, amount: 5}], expect: {points: 15}}

  - id: A07_ma_a_and_ma_o_with_once_per_day
    prompt: "Per transaction, count Snacks lines into activity-level 'snack lines'. If 'snack lines' is 3 or more, add 1 to the offer counter 'snack days', but at most once per calendar day (track the last counted day in a text offer attribute 'last snack day'). When 'snack days' reaches 3, give 500 bonus points once."
    expect: {status: [draft, needs_input], features: [mode:attribute_level=MA_A, mode:attribute_level=MA_O]}
    sequences:
      - bits:
          - {h_bit_date: "2026-10-20T10:00:00", lines: [{sku: SNK-1, qty: 1, amount: 1}, {sku: SNK-2, qty: 1, amount: 1}, {sku: SNK-1, qty: 1, amount: 1}], expect: {points: 0, mto: {snack days: 1}}}
          - {h_bit_date: "2026-10-20T15:00:00", lines: [{sku: SNK-1, qty: 1, amount: 1}, {sku: SNK-2, qty: 1, amount: 1}, {sku: SNK-1, qty: 1, amount: 1}], expect: {points: 0, mto: {snack days: 1}}}
          - {h_bit_date: "2026-10-21T10:00:00", lines: [{sku: SNK-1, qty: 1, amount: 1}, {sku: SNK-2, qty: 1, amount: 1}, {sku: SNK-1, qty: 1, amount: 1}], expect: {points: 0, mto: {snack days: 2}}}
          - {h_bit_date: "2026-10-22T10:00:00", lines: [{sku: SNK-1, qty: 1, amount: 1}, {sku: SNK-2, qty: 1, amount: 1}], expect: {points: 0, mto: {snack days: 2}}}
          - {h_bit_date: "2026-10-23T10:00:00", lines: [{sku: SNK-1, qty: 1, amount: 1}, {sku: SNK-2, qty: 1, amount: 1}, {sku: SNK-1, qty: 1, amount: 1}], expect: {points: 500, mto: {snack days: 3}}}
