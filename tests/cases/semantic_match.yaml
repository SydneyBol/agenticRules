# Words -> catalog codes on devintbf2: how well the manager's own words find the tenant's attributes and values.
#
# values: the lookup_values tool alone (catalog.lookup: word overlap + string similarity, no model), top-1 code against
#   the expected one. Run: tools/qa/check_lookup.py.
# cases: end to end through the model and the tools, as single blocks on the saved canvas (check_edit_flow.py
#   --cases=tests/cases/semantic_match.yaml): the block must carry the expected code (attr: any field or picked value).
#   Attribute names are chosen by the model from the catalog in its context; values through lookup_values.
# Kinds: exact (the label's own words), paraphrase (other words, same meaning), abbreviation, synonym (a different name
# for the same thing: Calcutta for Kolkata).
saved: results/devintbf2/hosted_combos/H12_rate_by_tier.saved.xml

values:
  - [member, tier_class, "Gold", GLDGLW, exact]
  - [member, tier_class, "gold tier", GLDGLW, exact]
  - [member, tier_class, "golden members", GLDGLW, paraphrase]
  - [member, tier_class, "silver", SLVR, exact]
  - [member, tier_class, "platinum card holders", PLTNM, paraphrase]
  - [member, tier_class, "diamond tier", DIA, exact]
  - [activity, h_location, "Hyderabad", HYD, exact]
