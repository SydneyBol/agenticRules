# English -> Blockly spike: scenario catalog.
# Each scenario: an English prompt, the expected intent (primitives from EnglishToBlockly.md §3.1),
# and BIT sequences with expected outcomes. Sequences run in order against ONE member, so counters carry over.
#
# Fixture tenant (engine harness):
#   program 1, sponsor 10, loyalty account "1" (Points), reward tag BONUS
#   privilege product 501 "Free Coffee" (usage policy 9)
#   locations L1 L2 L3; product category attr "category" on SKUs: SNK-1/SNK-2 = SNACKS, DRK-1 = DRINKS, BAK-1 = BAKERY
#   member M1: tier GOLD, date_of_birth per scenario
# Outcome keys: points = bonus points awarded by this offer on that BIT; privilege = privilege product id issued (or null).

fixtures:
  member: {id: M1, tier: GOLD, date_of_birth: "1990-06-15"}
  bit_defaults: {h_bit_category: ACCRUAL, h_bit_type: SPEND, h_sponsor_id: 10, h_location: L1}

scenarios:

  # ---------- tiered thresholds ----------
  - id: S01_tiered_exclusive
    pain: tiered
    prompt: "Give 2x points on spends over $100 and 3x points on spends over $500. Only the higher one applies."
    intent: {primitives: [{tiers: {measure: h_bit_amount, bands: [{gt: 100, le: 500, multiplier: 2}, {gt: 500, multiplier: 3}], exclusive: true}}]}
    sequences:
      - bits:
          - {h_bit_amount: 80,  expect: {points: 0}}
          - {h_bit_amount: 100, expect: {points: 0}}        # boundary: "over" is strict
          - {h_bit_amount: 101, expect: {points: 202}}
          - {h_bit_amount: 500, expect: {points: 1000}}
          - {h_bit_amount: 501, expect: {points: 1503}}     # NOT 1002 + 1503

  - id: S02_tiered_plus_cap
    pain: tiered
    prompt: "10% bonus points on every purchase, 20% if the purchase is $1000 or more, but no member can earn more than 300 bonus points in total."
    intent: {primitives: [{tiers: {measure: h_bit_amount, bands: [{lt: 1000, rate: 0.10}, {ge: 1000, rate: 0.20}], exclusive: true}}, {cap: {scope: lifetime, max_points: 300}}]}
    sequences:
      - bits:
          - {h_bit_amount: 500,  expect: {points: 50}}
          - {h_bit_amount: 1000, expect: {points: 200}}     # running 250
          - {h_bit_amount: 1000, expect: {points: 50}}      # capped remainder
          - {h_bit_amount: 400,  expect: {points: 0}}

  # ---------- combined conditions ----------
  - id: S03_combined_weekend_gold_locations
    pain: combined
    prompt: "Gold members get 100 bonus points on weekend spends of at least $50 at stores L1 or L2."
    intent: {primitives: [{bonus_if: {all: [{member.tier: GOLD}, {h_bit_date.DAY_OF_WEEK: {in: [SAT, SUN]}}, {h_location: {in: [L1, L2]}}, {h_bit_amount: {ge: 50}}], points: 100}}]}
    sequences:
      - bits:
          - {h_bit_date: "2026-10-24T12:00:00", h_location: L1, h_bit_amount: 50, expect: {points: 100}}   # Saturday
          - {h_bit_date: "2026-10-25T12:00:00", h_location: L3, h_bit_amount: 80, expect: {points: 0}}    # wrong store
          - {h_bit_date: "2026-10-26T12:00:00", h_location: L2, h_bit_amount: 80, expect: {points: 0}}    # Monday
          - {h_bit_date: "2026-10-24T12:00:00", h_location: L2, h_bit_amount: 49.99, expect: {points: 0}}
      - member_override: {tier: SILVER}
        bits:
          - {h_bit_date: "2026-10-24T12:00:00", h_location: L1, h_bit_amount: 50, expect: {points: 0}}

  - id: S04_happy_hour_or
    pain: combined
    prompt: "Double points on Fridays between 5pm and 7pm, or any time on Sundays."
    intent: {primitives: [{earn: {multiplier: 2, when: {any: [{all: [{DAY_OF_WEEK: FRI}, {HOUR_OF_DAY: {ge: 17, lt: 19}}]}, {DAY_OF_WEEK: SUN}]}}}]}
    sequences:
      - bits:
          - {h_bit_date: "2026-10-23T17:30:00", h_bit_amount: 10, expect: {points: 20}}
          - {h_bit_date: "2026-10-23T19:00:00", h_bit_amount: 10, expect: {points: 0}}   # 7pm exclusive
          - {h_bit_date: "2026-10-25T09:00:00", h_bit_amount: 10, expect: {points: 20}}
          - {h_bit_date: "2026-10-24T18:00:00", h_bit_amount: 10, expect: {points: 0}}   # Saturday

  # ---------- line item / SKU ----------
  - id: S05_category_per_item
    pain: line_item
    prompt: "5 bonus points for every snack item bought, and 2x points on drinks."
    intent: {primitives: [{line_item: {filter: {category: SNACKS}, points_per_unit: 5}}, {line_item: {filter: {category: DRINKS}, multiplier: 2, measure: l_amount}}]}
    sequences:
      - bits:
          - lines: [{sku: SNK-1, qty: 3, amount: 6}, {sku: DRK-1, qty: 1, amount: 4}, {sku: BAK-1, qty: 1, amount: 5}]
            expect: {points: 23}          # 3*5 + 4*2
          - lines: [{sku: BAK-1, qty: 2, amount: 10}]
            expect: {points: 0}

  - id: S06_collect_all_categories
    pain: line_item
    prompt: "Members who buy from snacks, drinks and bakery (across any visits) get a free coffee, once."
    intent: {primitives: [{collect_all: {items: [{category: SNACKS}, {category: DRINKS}, {category: BAKERY}], reward: {privilege: 501}, once: true}}]}
    sequences:
      - bits:
          - {lines: [{sku: SNK-1, qty: 1, amount: 2}], expect: {privilege: null}}
          - {lines: [{sku: DRK-1, qty: 1, amount: 2}], expect: {privilege: null}}
          - {lines: [{sku: SNK-2, qty: 1, amount: 2}], expect: {privilege: null}}
          - {lines: [{sku: BAK-1, qty: 1, amount: 2}], expect: {privilege: 501}}
          - {lines: [{sku: BAK-1, qty: 1, amount: 2}, {sku: DRK-1, qty: 1, amount: 2}], expect: {privilege: null}}  # once

  # ---------- multi-step / counters ----------
  - id: S07_every_5th_visit
    pain: counters
    prompt: "Every 5th visit gets a free coffee."
    intent: {primitives: [{nth_activity: {n: 5, repeat: true, reward: {privilege: 501}}}]}
    sequences:
      - bits: [{expect: {privilege: null}}, {expect: {privilege: null}}, {expect: {privilege: null}}, {expect: {privilege: null}},
               {expect: {privilege: 501}}, {expect: {privilege: null}}, {expect: {privilege: null}}, {expect: {privilege: null}},
               {expect: {privilege: null}}, {expect: {privilege: 501}}]

  - id: S08_spend_milestone_once
    pain: counters
    prompt: "Once a member's total spend reaches $1000, give them 500 bonus points. Only once."
    intent: {primitives: [{milestone: {measure: h_bit_amount, threshold: 1000, reward: {points: 500}, once: true}}]}
    sequences:
      - bits:
          - {h_bit_amount: 600, expect: {points: 0}}
          - {h_bit_amount: 399, expect: {points: 0}}
          - {h_bit_amount: 1,   expect: {points: 500}}    # crosses exactly 1000
          - {h_bit_amount: 900, expect: {points: 0}}

  - id: S09_unique_locations
    pain: counters
    prompt: "Visit 3 different stores and earn 300 bonus points."
    intent: {primitives: [{unique_count: {dimension: h_location, n: 3, reward: {points: 300}, once: true}}]}
    sequences:
      - bits:
          - {h_location: L1, expect: {points: 0}}
          - {h_location: L1, expect: {points: 0}}
          - {h_location: L2, expect: {points: 0}}
          - {h_location: L3, expect: {points: 300}}
          - {h_location: L3, expect: {points: 0}}

  - id: S10_unlock_then_earn
    pain: counters
    prompt: "After a member completes a hotel stay, their flight bookings earn double points."
    intent: {primitives: [{unlock: {trigger: {h_bit_type: STAY}, then: {earn: {filter: {h_bit_type: BOOKING}, multiplier: 2}}}}]}
    sequences:
      - bits:
          - {h_bit_type: BOOKING, h_bit_amount: 100, expect: {points: 0}}
          - {h_bit_type: STAY,    h_bit_amount: 200, expect: {points: 0}}
          - {h_bit_type: BOOKING, h_bit_amount: 100, expect: {points: 200}}

  - id: S11_monthly_streak
    pain: counters
    prompt: "Members who purchase in each of 3 consecutive months get 1000 bonus points."
    intent: {primitives: [{streak: {period: MONTH, n: 3, reward: {points: 1000}}}]}
    note: "Needs the periodic event section; engine harness drives EVENT bits at month end."
    sequences:
      - bits:
          - {h_bit_date: "2026-01-10T10:00:00", expect: {points: 0}}
          - {event: MONTH_END, h_bit_date: "2026-01-31T23:59:00"}
          - {h_bit_date: "2026-02-03T10:00:00", expect: {points: 0}}
          - {event: MONTH_END, h_bit_date: "2026-02-28T23:59:00"}
          - {h_bit_date: "2026-03-20T10:00:00", expect: {points: 0}}
          - {event: MONTH_END, h_bit_date: "2026-03-31T23:59:00", expect: {points: 1000}}

  # ---------- recurring date offers ----------
  - id: S12_birthday_window_once_per_year
    pain: recurring
    prompt: "500 bonus points on a purchase within 20 days before or after the member's birthday, once per birthday. The window follows the birthday across New Year, and purchases in December and January around the same birthday share its one reward."
    intent: {primitives: [{occasion: {date_attr: member.date_of_birth, window_days: 20, recurrence: per_occurrence, reward: {points: 500}}}]}
    semantics: >
      Window = nearest occurrence of the birthday to the BIT date, +-20 days inclusive. "Once a year" = once per
      birthday occurrence (so a Dec-20 purchase for a Jan-3 birthday counts toward the NEXT year's occurrence).
    sequences:
      - member_override: {date_of_birth: "1990-06-15"}
        bits:
          - {h_bit_date: "2026-05-25T10:00:00", expect: {points: 0}}     # day -21: outside (off-by-one trap)
          - {h_bit_date: "2026-05-26T10:00:00", expect: {points: 500}}   # day -20: inside
          - {h_bit_date: "2026-06-20T10:00:00", expect: {points: 0}}     # already rewarded this occurrence
          - {h_bit_date: "2027-06-15T10:00:00", expect: {points: 500}}   # next year again
      - member_override: {date_of_birth: "1985-01-03"}                   # year wrap
        bits:
          - {h_bit_date: "2026-12-14T10:00:00", expect: {points: 500}}   # -20 days of 2027-01-03
          - {h_bit_date: "2027-01-10T10:00:00", expect: {points: 0}}     # same occurrence
          - {h_bit_date: "2027-01-24T10:00:00", expect: {points: 0}}     # +21, outside
      - member_override: {date_of_birth: "1992-12-25"}
        bits:
          - {h_bit_date: "2027-01-14T10:00:00", expect: {points: 500}}   # +20 of 2026-12-25
          - {h_bit_date: "2027-12-05T10:00:00", expect: {points: 500}}   # -20 of 2027-12-25 (new occurrence)
      - member_override: {date_of_birth: "2000-02-29"}                   # leap-day birthday
        bits:
          - {h_bit_date: "2027-03-20T10:00:00", expect: {points: 500}}   # window = 02-09..03-20 every year (dob +-20 in birth year)
          - {h_bit_date: "2028-03-21T10:00:00", expect: {points: 0}}
      - member_override: {date_of_birth: "2000-03-10"}                   # KNOWN GAP: +-20 computed in the (leap) birth year
        known_gap: true
        bits:
          - {h_bit_date: "2026-02-18T10:00:00", expect: {points: 500}}   # true -20 in 2026; platform window starts 02-19 -> 0
      - member_override: {date_of_birth: "2000-03-01"}                   # leap-year DAY_OF_YEAR trap
        bits:
          - {h_bit_date: "2026-03-01T10:00:00", expect: {points: 500}}

  - id: S13_enrolment_anniversary
    pain: recurring
    prompt: "On the week of their membership anniversary (3 days either side), members get a free coffee, once each year."
    intent: {primitives: [{occasion: {date_attr: member.enrollment_date, window_days: 3, recurrence: per_occurrence, reward: {privilege: 501}}}]}
    sequences:
      - member_override: {enrollment_date: "2021-08-10"}
        bits:
          - {h_bit_date: "2026-08-07T10:00:00", expect: {privilege: 501}}
          - {h_bit_date: "2026-08-12T10:00:00", expect: {privilege: null}}
          - {h_bit_date: "2026-08-14T10:00:00", expect: {privilege: null}}

  # ---------- reliability / honesty ----------
  - id: S14_simple_sanity
    pain: empty_response
    prompt: "10 points per dollar spent."
    intent: {primitives: [{earn: {rate_per_unit: 10, measure: h_bit_amount}}]}
    sequences:
      - bits: [{h_bit_amount: 12.5, expect: {points: 125}}]

  - id: S15_ambiguous_store
    pain: empty_response
    prompt: "Triple points at the airport store this weekend."
    expect_questions: ["Which location is 'the airport store'?", "Which dates is 'this weekend'?"]
    intent: {primitives: [{earn: {multiplier: 3, when: {h_location: "?"}}}]}

  - id: S16_unsupported_referral
    pain: honesty
    prompt: "Give 1000 points to members whose referred friends each spend $100 within a month."
    expect_unsupported: "Cross-member condition (friend's spend) is not expressible on the referrer's BIT; suggest third-party ACTIVITY_REFERRER reward on the friend's BIT instead."
